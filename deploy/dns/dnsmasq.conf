# Only needed if your router can't add a local DNS record (option B in VECTOR-CLOUD-SETUP.md).
# Answers escapepod.local with this server's public IP and forwards every other lookup to Cloudflare.
# Replace SERVER_PUBLIC_IP. The firewall must allow port 53 only from your home's public IP.
no-resolv
server=1.1.1.1
server=1.0.0.1
address=/escapepod.local/SERVER_PUBLIC_IP
listen-address=0.0.0.0
bind-interfaces
cache-size=1000
