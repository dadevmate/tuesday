<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuesday</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e8eaf0; --muted:#8b93a7; --accent:#7aa2ff; --me:#24314f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f5f6f9; --panel:#fff; --line:#e1e4ec; --text:#1b1f29; --muted:#667085; --me:#e6edff; } }
  * { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--panel); }
  header b { letter-spacing:.5px; } #status { color:var(--muted); font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:860px; width:100%; margin:0 auto; }
  .m { padding:10px 12px; border-radius:10px; max-width:88%; white-space:pre-wrap; } .me { align-self:flex-end; background:var(--me); } .t { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .meta { color:var(--muted); font-size:11px; margin-top:4px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  textarea { flex:1; resize:none; height:46px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<header><b>TUESDAY</b><span id="status">connecting…</span></header>
<div id="log"></div>
<form id="f"><textarea id="q" placeholder="Ask Tuesday… (/council, /quick, /thursday… · /long for a full answer)"></textarea><button>Send</button></form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q');
// On a cloud server, open the page once as https://<domain>/#token=<TUESDAY_API_TOKEN>; the token is kept in this browser.
let token = ''; try { const m = location.hash.match(/token=([^&]+)/); if (m) { localStorage.setItem('tuesday-token', m[1]); history.replaceState(null, '', location.pathname); } token = localStorage.getItem('tuesday-token') || ''; } catch {}
const auth = token ? { Authorization: 'Bearer ' + token } : {};
const add = (cls, text, meta) => { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; if (meta) { const s = document.createElement('div'); s.className = 'meta'; s.textContent = meta; d.appendChild(s); } log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
fetch('/health', { headers: auth }).then(r => r.json()).then(h => { document.getElementById('status').textContent = h.robot ? `robot: ${h.robot} · core: ${h.local} · cloud: ${h.cloud}` : 'online'; }).catch(() => { document.getElementById('status').textContent = 'offline'; });
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault(); const text = q.value.trim(); if (!text) return; q.value = ''; add('me', text);
  const p = add('t', '…');
  try { const r = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', ...auth }, body: JSON.stringify({ message: text, channel: 'web' }) }).then(r => r.json());
    p.textContent = r.reply || r.error; const s = document.createElement('div'); s.className = 'meta'; s.textContent = `${r.model || ''} · ${r.route || ''}`; p.appendChild(s);
  } catch { p.textContent = 'Could not reach Tuesday.'; }
};
// Proactive messages (briefings, check-ins, nudges, reminders) also appear here, not only through the robot.
let since = Date.now() / 1000;
setInterval(() => fetch('/announcements?since=' + since, { headers: auth }).then(r => r.json()).then(r => {
  for (const a of r.items || []) add('t', a.text, a.kind === 'reply' ? 'Tuesday · after thinking' : 'Tuesday · proactive');
  if (r.now) since = r.now;
}).catch(() => {}), 3000);
q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
</script>
</body>
</html>
